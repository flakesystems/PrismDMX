[package]
name = "prism-protocols"
description = "DMX outputs (Open DMX USB, ArtNet, sACN) and PSN/OSC input."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
prism-domain = { path = "../prism-domain" }
# The output side consumes what the engine publishes: `FrameSubscriber`,
# `FrameLayout` and the `Clock` a driver thread paces itself against.
prism-engine = { path = "../prism-engine" }

# The two Windows access paths of ARCHITECTURE_SPEC.md §7.1, and the only
# platform-specific dependencies in the workspace. Declared per target so the
# Linux test job and the ARM64 cross-check never see them: everything above
# `FtdiBackend` is platform-neutral and is built and tested on both.
#
# `static` links FTDI's own D2XX library into the binary rather than depending
# on whichever ftd2xx.dll a school's machine happens to have installed.
#
# **Windows only, and it stays that way** — S63. D2XX on macOS means unloading
# Apple's own `AppleUSBFTDI` driver before the library can claim the device,
# which is a kernel extension a school cannot be asked to touch and which would
# take the virtual COM port away from every other program on the machine.
[target.'cfg(windows)'.dependencies]
libftd2xx = { version = "0.33", features = ["static"] }

# **The serial port, on both platforms that have one** — S63.
#
# `serialport` is what the virtual COM port path (`vcp.rs`) is written against
# and it is cross-platform already: `COM3` on Windows, `/dev/cu.usbserial-…` on
# macOS, both reached through the same `set_break`/`clear_break` calls. So macOS
# gains an access path by declaring a dependency it already had the code for,
# rather than by a second implementation — see `system.rs`.
#
# Linux is deliberately **not** in this list. §7.1 gives it libftdi and not the
# kernel's `ftdi_sio`, D10 has no machine to verify one on, and adding
# `serialport` there would drag `libudev` into the ARM64 cross-check, which is
# a C library that job must not need.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
serialport = "4.9"

[target.'cfg(windows)'.dev-dependencies]
# The bring-up target reaches past the backend to time the library calls
# themselves: "did this frame leave the port before the break was asserted?"
# cannot be asked through a trait that deliberately hides the answer.
libftd2xx = { version = "0.33", features = ["static"] }

[dev-dependencies]
# S1 put `arb` and the `Arbitrary` impls behind a feature so the crates above
# could property-test against real domain values instead of growing their own
# generators.
prism-domain = { path = "../prism-domain", features = ["proptest"] }
proptest = { workspace = true }

[lints]
workspace = true
