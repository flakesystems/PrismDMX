[package]
name = "prism-surface"
description = "Mackie Control codec, surface model and binding table for the X-Touch."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
prism-domain = { path = "../prism-domain" }
# Layer 3 only. The binding table ships as JSON a user edits
# (docs/MCU_MAPPING.md section 4.2), so the crate has to read one - but it reads
# a `&str` and never a path: which file it was is `prismd`'s business, and that
# is what lets the fallback-to-defaults guarantee be tested without a
# filesystem. Layers 1 and 2 use neither.
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# "Every valid event encodes and decodes back to itself" is a claim about a
# space a table cannot enumerate: 16 384 fader positions times nine faders on
# its own. The same generator-based approach `prism-engine` and `prism-ipc`
# already use, with the strategies local to this crate - `prism_domain::arb`
# describes domain values, and layer 1 has none.
proptest = { workspace = true }

[lints]
workspace = true
