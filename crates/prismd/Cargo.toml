[package]
name = "prismd"
description = "PrismDMX engine daemon. Owns the show, the outputs and the control surface."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# A library beside the binary, so the daemon can be started inside a test
# process. `tests/` links a crate's *library* target and a binary has none, and
# the exit criteria for this session — a daemon that runs with no client, a
# second instance that refuses to start, a stale lock file that is taken over —
# are all statements about a running daemon.
[lib]
name = "prismd"
path = "src/lib.rs"

[[bin]]
name = "prismd"
path = "src/main.rs"

[dependencies]
prism-core = { path = "../prism-core" }
prism-domain = { path = "../prism-domain" }
prism-engine = { path = "../prism-engine" }
prism-ipc = { path = "../prism-ipc" }
# The MIDI port, and the reason it is a crate of its own: opening one is
# `#[cfg(target_os = ...)]` from top to bottom and section 10.1 allows this crate
# none. Exactly the move `thread-priority` is below, one device along - and the
# ARM64 cross-check is what says it worked, because on that target `prism-midi`
# has no dependencies at all.
prism-midi = { path = "../prism-midi" }
prism-protocols = { path = "../prism-protocols" }
prism-surface = { path = "../prism-surface" }
serde = { workspace = true }
# The machine configuration is a file a technician reads and occasionally
# edits, so it is JSON rather than the MessagePack the show file uses.
serde_json = { workspace = true }
# ARCHITECTURE_SPEC.md section 3 names the runtime for `core-main`. The engine
# tick is not on it: that is an OS thread of its own, at a priority of its own.
tokio = { version = "1.49", features = [
    "rt",
    "rt-multi-thread",
    "net",
    "sync",
    "time",
    "signal",
    "macros",
] }
# The desk identity is a UUID and a UUID needs entropy. `prism-core` is
# dependency-free by rule and says so in as many words (`desk.rs`): it parses,
# holds and formats a `DeskId`, and one is generated here.
getrandom = "0.4"
# Where the platform code for the tick thread's priority lives, and the reason
# it is a dependency at all: `prismd` may contain no `#[cfg(target_os = ...)]`
# (ARCHITECTURE_SPEC.md section 10.1), raising a thread's priority is
# `SetThreadPriority` on Windows and `pthread_setschedparam` elsewhere, and the
# workspace forbids `unsafe_code`. The same move S16 made with tokio's `net`
# feature for the named pipe and the Unix domain socket.
thread-priority = "3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "cookies", "blocking", "form"] }

[dev-dependencies]
prism-ipc = { path = "../prism-ipc" }
# Show files and lock files under test go into a directory that removes itself,
# including after a panic.
tempfile = "3"
tokio = { version = "1.49", features = ["test-util"] }

[lints]
workspace = true

# The credential manager, for the GDTF Share account an operator asks this desk
# to remember — S62, and `src/secrets.rs` says why a settings file is the wrong
# place for a password.
#
# Windows and macOS, and the pair is deliberate: both are machines a person is
# logged in to, with a secret store the desktop session unlocks. On Linux and
# the Pi remembering is still refused in words rather than falling back to a
# file — a desk in a rack has no session to unlock a keyring with, and a
# silent fallback would be the plaintext `src/secrets.rs` exists to avoid.
#
# `keyring`'s own platform stores are target-gated, so the default features
# resolve to the Windows store here and nothing else — and `v1` is not
# optional, the crate refuses to build without it.
[target."cfg(windows)".dependencies]
keyring = "4.2"

# The same crate and the same `v1` API on macOS — **S63**. The Apple store is
# *not* a default feature (the defaults are `v1`, the Windows store and the
# Secret Service one), so it is asked for by name; with it, `keyring::Entry`
# reaches the login keychain and `src/secrets.rs` needs one `#[cfg]` widened
# rather than a second implementation.
[target."cfg(target_os = \"macos\")".dependencies]
keyring = { version = "4.2", features = ["apple-native-keyring-store"] }
