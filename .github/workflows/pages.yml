# docs.prismdmx.de — the deployment, which is a push.
#
# S42's exit criteria say the deployment is reproducible and that the domain
# serves over TLS. Both are met by *not* having a deployment procedure: the site
# is built by a runner from a commit, and GitHub Pages serves the apex domain
# with a certificate it issues and renews itself. There is nothing to run on
# anybody's machine and no key anywhere.
#
# **Why this is a workflow of its own and not a step in `ci.yml`'s `web` job.**
# `ci.yml` runs on every branch and every pull request, and the job there builds
# the site and stops — so a commit's CI answers one question, *does the site
# still generate*, on a machine that is not the author's. Publishing is a
# different question with a different failure mode: Pages has to be enabled for
# the repository and the DNS has to point here, and neither is something a
# commit can be wrong about. Keeping them apart means a deployment that cannot
# happen yet does not turn a green commit red.
#
# **A release comes in the other door.** The download page's checksum is
# computed from the installer, and the only run that has an installer is the one
# that just built it — so `release.yml` generates the site with `--installer`
# pointing at the `.exe` it is about to attach, and uploads it as the
# `prismdmx-site` artefact. This workflow deploys that artefact rather than
# rebuilding, which is how the number on the page stays the number of the file.
#
# **It is reached by `workflow_run` and not by the tag**, and that is a
# repository setting rather than a preference. The `github-pages` environment
# accepts deployments from `master` alone; `release.yml` used to hold a
# deployment job of its own and v0.9.3 was the first release to meet that
# setting — the job was refused before a single step ran. A `workflow_run`
# event's ref is the default branch whatever ref triggered the run underneath
# it, so the deployment is made from `master` while the files come from the tag
# run. Nothing here fires on a tag, and that is still true.
#
# **If this ever moves to a self-hosted server, it has to invert.** SSH into that
# server is allowed only over VPN, so a build runner cannot `rsync` into it and
# the answer is not to make an exception for one. The server would **pull**
# instead: `release.yml` attaches the generated site as a release asset, and a
# timer on the server fetches it over outbound HTTPS, verifies its digest and
# unpacks it. Outbound only, no inbound port, and no deploy key held by GitHub —
# which is the same property this workflow has today and worth not losing.
#
# **What a human still has to do, once.** Pages is enabled. What is left is the
# DNS: a plain `CNAME` record for `docs.prismdmx.de` pointing at
# `flakesystems.github.io`. A subdomain rather than the apex, deliberately — the
# apex belongs to the promotion site on its own hosting — and a subdomain is the
# easy case, needing none of the `ALIAS`, `ANAME` or four-`A`-record juggling an
# apex does. The generator writes `CNAME` itself, so the domain is one constant
# in one place (`prism_web::DOMAIN`).

name: Pages

on:
  push:
    branches: ["master"]
  # A release run, when it has finished building. `workflows` names the
  # `name:` of `release.yml`, and only a copy of this file on the default
  # branch can be triggered this way — which is GitHub's rule, and the same
  # rule that makes the deployment come from `master`.
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  # So a deployment can be made without waiting for a commit.
  workflow_dispatch:

# Only what deploying needs, and nothing else. `actions: read` is what lets the
# `workflow_run` path reach into the release run for its artefact; it is read
# and it is scoped to this repository.
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

# One deployment at a time, and a newer commit wins. Cancelling a running
# deployment is safe here because the site is generated: there is no state to
# leave half written.
concurrency:
  group: pages
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  deploy:
    name: Build and deploy docs.prismdmx.de
    # A `workflow_run` fires for **every** Release run, and most of them are not
    # releases: a `workflow_dispatch` exists precisely to build without
    # publishing, and it generates a site too. So only a run that was a **tag
    # push** is followed — `event` says which trigger it had and `head_branch`
    # carries the tag name for a tag push.
    #
    # A red run is still followed, deliberately. The macOS half can fail with
    # the Windows half green, and that run has an installer, a release and a
    # page whose checksum belongs to it. What it cannot survive is having built
    # no site at all, and `There is a site to deploy` below is where that stops.
    if: >-
      github.event_name != 'workflow_run'
      || (github.event.workflow_run.event == 'push'
          && github.event.workflow_run.conclusion != 'cancelled'
          && startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # ---- Either the site the release built ----
      # Taken whole rather than regenerated. The checksum on the download page
      # is the hash of the `.exe` that run attached, and this runner does not
      # have that file; rebuilding here would produce the same pages with the
      # one number on them missing.
      - name: Take the site the release built
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: prismdmx-site
          path: docs-site
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # ---- or one built here ----
      # `docs-site/` and not `site/`: since S55 a crate of that name lives one
      # directory up, and a generator writing into it would put `prism-site`'s
      # sources on the deployed page. See `ci.yml`'s `web` job.
      - uses: actions/checkout@v5
        if: github.event_name != 'workflow_run'
      - uses: dtolnay/rust-toolchain@stable
        if: github.event_name != 'workflow_run'
      - uses: Swatinem/rust-cache@v2
        if: github.event_name != 'workflow_run'

      - name: Build the site
        if: github.event_name != 'workflow_run'
        run: cargo run -p prism-web -- --out docs-site

      # **A deployment of nothing would be a deployment.** Pages does not mind
      # an empty directory and would happily serve the site away; the one thing
      # that can produce one here is a download that found no artefact, so it
      # is checked before anything is published rather than discovered by
      # somebody opening the domain.
      - name: There is a site to deploy
        run: |
          set -euo pipefail
          if [ ! -s docs-site/index.html ]; then
            echo "::error::docs-site/index.html is missing or empty; nothing is deployed"
            exit 1
          fi
          echo "deploying $(find docs-site -type f | wc -l | tr -d ' ') files"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site

      - id: deployment
        uses: actions/deploy-pages@v4
