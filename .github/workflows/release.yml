# The release build — S29.
#
# What a release is, decided here rather than left to a habit:
#
# **It hangs on a tag**, `v<major>.<minor>.<patch>`, and the tag is the trigger
# rather than a GitHub release object. A workflow that ran on `release:
# published` would need a release to exist before the artefact that goes in it
# had been built, which is the wrong way round: this one builds first and makes
# the release with the installer already attached.
#
# **The version comes from the workspace manifest** and from nowhere else.
# `crates/prism-app/tests/version.rs` is what holds that: `tauri.conf.json`
# carries no version at all, so the bundler falls back to the crate's, which is
# `[workspace.package] version`. The job below checks that the tag agrees with
# it and refuses otherwise, because a tag and a manifest that disagree produce
# an installer whose file name is a lie.
#
# **It is the complete pass, and since 2026-09-18 the only one.** `ci.yml` runs
# on Linux alone on every push, because Windows runner minutes cost twice as
# much and the two Windows jobs ran twenty minutes a push. Everything Windows
# answers - the whole workspace's tests including `prism-app`, the corpus on a
# Windows checkout, clippy and the docs over the shell, the installer and what
# is inside it - is asked here, and `ci.yml` is called first so a release is
# gated on the Linux half as well. `workflow_dispatch` runs the whole of it
# without publishing anything, which is the answer when a change wants the
# Windows half before a release: a platform-specific crate, the installer, the
# shell.
#
# **It runs the gates again.** Trusting the commit's own CI run would be enough
# almost every time and wrong the once: a tag can be put on a commit whose run
# never finished, on a commit from a branch that was never merged, or on one
# whose run went red after somebody stopped looking. A release built from red
# code is the most expensive mistake this session could make, and re-running the
# gates costs twenty minutes.
#
# **It is given no secrets it does not need.** The only one is
# `GITHUB_TOKEN`, which the runner supplies, and it is granted `contents: write`
# and nothing else. There is no signing certificate here yet — the release notes
# say so, and say what SmartScreen will do about it, which is where a beta tester
# should read it rather than in a support request.
#
# **And it builds the site but does not deploy it** — S42. The download page's
# checksum is computed from the installer rather than transcribed, so the only
# run that can produce that page is the one that has just built the file: the
# Windows job generates it and uploads it as the `prismdmx-site-release`
# artefact — named apart from `ci.yml`'s own `prismdmx-site`, which is built
# without a checksum and lands in this same run. `pages.yml` takes it and
# deploys it when this workflow finishes.
#
# **Why the deployment is not a job here, since it once was.** Two reasons, and
# the second is the one that decided it. A release job that could write Pages
# would hold `contents: write` and `pages: write` at once, which is a pairing
# worth never having. And the `github-pages` environment only accepts
# deployments from `master` — a repository setting, added the day after v0.9.2
# shipped, which is why v0.9.3 was the first release to meet it and why its
# deployment was refused at job level in two seconds, with no step run and no
# log to read. A tag is not `master` and no amount of workflow can make it one.
# `pages.yml` is reached instead by `workflow_run`, whose ref *is* the default
# branch, so the deployment happens from the branch the setting names while the
# checksum still comes from the run that built the file.

name: Release

on:
  push:
    tags: ["v*"]
  # So the whole thing can be exercised without cutting a release: it builds and
  # uploads the installer as a workflow artefact, and creates nothing.
  workflow_dispatch:
    inputs:
      # **A cost switch, and nothing else** — S63. A tag always runs everything;
      # this only narrows a *by-hand* run. It exists because getting the macOS
      # signing right took several goes, and each one rebuilt a Windows half
      # that had already passed — twenty-five minutes at twice the Linux rate,
      # for an answer nobody was waiting for.
      #
      # The Linux gates always run: they are the cheapest of the three and they
      # are what `release.yml` calls `ci.yml` for.
      only:
        description: "Which platform to build (a tag always builds both)"
        type: choice
        default: all
        options: [all, macos, windows]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # The Linux half of the complete pass: exactly what every push runs.
  linux:
    name: Linux gates
    uses: ./.github/workflows/ci.yml

  build:
    name: Windows - full pass and installer
    needs: linux
    # Always on a tag; on a by-hand run only when it was asked for. `inputs` is
    # empty for any event but `workflow_dispatch`, so the first clause is what
    # makes a release build everything.
    if: >-
      github.event_name != 'workflow_dispatch'
      || inputs.only == 'all' || inputs.only == 'windows'
    runs-on: windows-latest
    # Every gate again, then a release build of the daemon, then the shell with
    # LTO and one codegen unit, on a cache this job has never warmed. Ninety
    # minutes is what that costs the first time and it is the right thing to
    # spend it on: this is the job that decides what a person downloads.
    timeout-minutes: 90
    env:
      # As in ci.yml, and for the same reason: RUSTFLAGS from the environment
      # replaces .cargo/config.toml's rather than adding to them, so the static
      # C runtime has to be asked for again here. .cargo/config.toml has the
      # reasoning, and S29 is where it changed - the shell links a second
      # static library and one link cannot both have the static runtime and
      # not have it.
      RUSTFLAGS: "-D warnings -Ctarget-feature=+crt-static"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: Swatinem/rust-cache@v2

      # **The tag and the manifest have to be the same number.** A tag that
      # disagrees produces an installer named after one version and carrying
      # another, and nothing downstream would ever notice.
      - name: The tag is the version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v')
          $manifest = Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' |
            Select-Object -First 1
          $version = $manifest.Matches[0].Groups[1].Value
          if ($tag -ne $version) {
            Write-Error "the tag says $tag and Cargo.toml says $version"
            exit 1
          }
          Write-Output "building $version"

      # The corpus the Open Fixture Library reader's tests run over. The desk's
      # own library is **GDTF** since S61 and its upstream has no anonymous
      # download, so a release build ships the installer rather than the data —
      # which is what `profiles/fixtures/SOURCE.md` says and what the installer's
      # manual tells a technician to run once on the machine.
      - name: Install the Open Fixture Library corpus
        shell: pwsh
        run: tools/fetch-fixtures/fetch-ofl.ps1

      - name: Install the interface's dependencies
        working-directory: ui
        run: npm ci

      # ---- The gates, again ----
      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The whole workspace, `prism-app` included - the one place outside the
      # developer's machine that documents the shell (ci.yml excludes it).
      - name: Document
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --no-deps

      - name: Test
        run: cargo test --workspace

      # ui/src/bindings is generated rather than committed, and `cargo test`
      # above has just written it — so the typecheck below has something to read.
      - name: Typecheck the interface
        working-directory: ui
        run: npx tsc -b --force

      - name: Lint the interface
        working-directory: ui
        run: npm run lint

      - name: Test the interface
        working-directory: ui
        run: npm run test

      # ---- The build ----
      # The daemon first and in release, because the bundle carries it as a
      # resource: `prism_app::spawn::daemon_beside` looks for `prismd.exe` in the
      # installation directory, and so does the fixture library's own search.
      - name: Build the engine
        run: cargo build --release -p prismd

      # `shell: bash` on purpose. The default on a Windows runner is PowerShell,
      # which will not execute the extensionless shell script npm puts in
      # `node_modules/.bin`; bash is present on every Windows runner and is the
      # same invocation the README gives a developer.
      - name: Build the installer
        working-directory: crates/prism-app
        shell: bash
        run: ../../ui/node_modules/.bin/tauri build --config tauri.bundle.conf.json

      # What a person is about to download, asked of the file itself. A
      # configuration without the payload in it bundles perfectly happily and
      # produces an installer whose program cannot find its own engine.
      - name: What the installer contains
        shell: pwsh
        run: |
          $setup = Get-ChildItem target/release/bundle/nsis/*-setup.exe |
            Select-Object -First 1
          if (-not $setup) { Write-Error "no installer was produced"; exit 1 }
          $files = & "$env:ProgramFiles\7-Zip\7z.exe" l $setup.FullName
          # **`profiles\fixtures\ofl\` and not `profiles\fixtures\`.** S61 moved
          # the Open Fixture Library corpus down a level when the desk's own
          # library became GDTF, and this list was not moved with it — so it
          # named a file that has not existed since, and the next `v*` tag would
          # have failed here. Found by S63 building the macOS bundle and
          # checking the same four paths against a real one.
          foreach ($needed in @(
            "PrismDMX.exe",
            "prismd.exe",
            "profiles\surface\xtouch.json",
            "profiles\fixtures\ofl\manufacturers.json"
          )) {
            if (-not ($files -match [regex]::Escape($needed))) {
              Write-Error "the installer does not carry $needed"
              exit 1
            }
            Write-Output "carries $needed"
          }

      # The checksum goes in the release notes, because the build is not signed
      # and a checksum is what somebody who would rather not click through
      # SmartScreen can check instead.
      - name: Checksum
        id: installer
        shell: pwsh
        run: |
          $setup = Get-ChildItem target/release/bundle/nsis/*-setup.exe |
            Select-Object -First 1
          if (-not $setup) { Write-Error "no installer was produced"; exit 1 }
          $hash = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLower()
          Write-Output "path=$($setup.FullName)" >> $env:GITHUB_OUTPUT
          Write-Output "name=$($setup.Name)" >> $env:GITHUB_OUTPUT
          Write-Output "sha256=$hash" >> $env:GITHUB_OUTPUT
          Write-Output "$($setup.Name)  $hash"

      # Always, tag or not: a `workflow_dispatch` run exists to produce exactly
      # this and to create nothing.
      - uses: actions/upload-artifact@v4
        with:
          name: prismdmx-installer
          path: target/release/bundle/nsis/*-setup.exe
          retention-days: 14

      # ---- The release ----
      # The notes are **this version's section** of the file in the repository,
      # plus the checksum of the file that was just built, in one document. One
      # `body_path` rather than a `body` beside it, because the action takes the
      # path in preference to the text and the checksum would have gone
      # silently.
      #
      # **Why a section and not the file.** `docs/RELEASE_NOTES.md` keeps every
      # release's notes, newest first, and that is worth keeping: it is the one
      # document where a reader can follow what the desk became. But pasting it
      # whole is what put 0.9.3's notes, 0.9.2's and 0.9.1's on a single release
      # page — three announcements under one version number, the two that were
      # not this release longer than the one that was. A release page answers
      # *what changed in this version*; the history has a file of its own and a
      # link to the other releases beside it on GitHub.
      #
      # The section is found by its own heading — `# PrismDMX <version>`, which
      # is the only thing in that file at heading level one — and ends where the
      # next one begins, minus the `---` and the blank lines that separate them
      # and belong to neither.
      #
      # **A missing section stops the release**, rather than falling back to the
      # whole file or to the newest section. A tag whose notes were never
      # written is exactly the case where a guess publishes the wrong text under
      # the right version number, which is worse than no release at all.
      - name: The release notes
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $lines = @(Get-Content docs/RELEASE_NOTES.md)
          $heads = @(0..($lines.Count - 1) |
            Where-Object { $lines[$_] -match '^# PrismDMX ' })
          $pattern = '^# PrismDMX ' + [regex]::Escape($version) + '(\s|$)'
          $start = $heads | Where-Object { $lines[$_] -match $pattern } |
            Select-Object -First 1
          if ($null -eq $start) {
            Write-Error "docs/RELEASE_NOTES.md carries no '# PrismDMX $version' section"
            exit 1
          }
          $next = $heads | Where-Object { $_ -gt $start } | Select-Object -First 1
          $end = if ($null -eq $next) { $lines.Count - 1 } else { $next - 1 }
          while ($end -gt $start -and
                 ($lines[$end].Trim() -eq '' -or $lines[$end].Trim() -eq '---')) {
            $end--
          }
          $notes = ($lines[$start..$end] -join "`n")
          $notes += "`n`n---`n`n**SHA-256** of ``${{ steps.installer.outputs.name }}``:`n"
          $notes += "``${{ steps.installer.outputs.sha256 }}```n"
          Set-Content -Path release-body.md -Value $notes -Encoding utf8
          Write-Output "release body: $($end - $start + 1) lines of notes, from '$($lines[$start])'"

      # Marked **pre-release**: what makes 0.9.0 a closed beta is this flag
      # rather than a suffix on the version, because a Windows installer version
      # has to be three numbers and nothing else.
      - name: The release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.installer.outputs.path }}
          name: PrismDMX ${{ github.ref_name }}
          prerelease: true
          generate_release_notes: false
          body_path: release-body.md

      # ---- The site ----
      # S42, and this is the whole of what *the checksum is not typed by
      # anybody* means: the generator is handed the file that was just built and
      # hashes it, so the number on docs.prismdmx.de is the number of the `.exe`
      # attached above. It is uploaded here rather than deployed here because
      # deploying needs permissions this job should not have - the job below
      # has them and nothing else.
      # `docs-site/` and not `site/`: since S55 a crate of that name lives one
      # directory up, and a generator writing into it would attach and publish
      # `prism-site`'s sources beside the manuals. See `ci.yml`'s `web` job.
      - name: Build the site with this release's checksum
        run: cargo run -p prism-web -- --out docs-site --installer "${{ steps.installer.outputs.path }}"

      # A plain artefact, not a Pages one. `upload-pages-artifact` builds a tar
      # the Pages service expects and is a Linux action; this job is on Windows
      # because that is where the installer it hashed came from. So the pages
      # artefact is made by `pages.yml`, out of these files.
      #
      # **`-release` on the end, and it is not decoration.** `release.yml` calls
      # `ci.yml`, whose `web` job uploads a site of its own — built with no
      # `--installer`, because a Linux gate has no `.exe` to hash — and a
      # reusable workflow's artefacts land in the **calling run**. Both were
      # called `prismdmx-site`, so a release run carried two artefacts of one
      # name, one with the checksum on the download page and one without, and
      # `download-artifact` picked between them by an undocumented tie-break:
      # the newest wins, which happened to be this one because the Windows job
      # `needs: linux` and therefore always finishes later.
      #
      # It worked, and it was luck standing where a name should be. A download
      # page whose checksum silently went missing is exactly the failure S42
      # built the `--installer` path to prevent, and it would have been visible
      # to nobody: the page renders, the job is green, and the row is simply
      # not there.
      - uses: actions/upload-artifact@v4
        with:
          name: prismdmx-site-release
          path: docs-site
          retention-days: 14


  # ---------------------------------------------------------------------------
  # macOS — the second installer, and the first one that is signed. **S63.**
  #
  # **It is here and not in `ci.yml`, and that is the rule rather than a
  # preference.** `IMPLEMENTATION_PLAN.md` §7 and `CLAUDE.md` keep every push on
  # Linux because runner minutes are billed by the platform and a macOS minute
  # is the dearest of the three — ten times a Linux one at GitHub's published
  # rate, where Windows is twice. A push therefore runs Linux, and this job runs
  # on a tag and by hand, exactly as the Windows one does. **Do not add a macOS
  # job to `ci.yml`**; if Linux can answer a question it belongs there, and if
  # only a Mac can, it belongs here.
  #
  # What keeps the macOS code from rotting between releases is not this job
  # running often — it is that `prism-protocols`, `prismd` and `prism-app` now
  # carry `#[cfg(target_os = "macos")]` branches with tests beside them
  # (`ARCHITECTURE_SPEC.md` §10.1), and that the developer's own Mac runs the
  # whole suite before a push. This job is where that is *repeated* and where
  # the signed artefact is made.
  #
  # **Signing is conditional, and on purpose.** A fork, and a
  # `workflow_dispatch` run by somebody with no certificate, must still be able
  # to build a `.app` — so every secret is read through a guard and the job
  # produces an *unsigned* bundle when they are absent, saying so in the log.
  # What must never happen is the third state: a run that thinks it signed
  # something and did not. `Verify the signature` is what refuses that.
  macos:
    name: macOS - full pass, bundle and signature
    needs: linux
    # See the Windows job above.
    if: >-
      github.event_name != 'workflow_dispatch'
      || inputs.only == 'all' || inputs.only == 'macos'
    runs-on: macos-latest
    # The gates again, then a release build of the daemon and the shell with
    # LTO and one codegen unit, on a cache this job has never warmed, and then
    # a notarisation that waits on Apple's service.
    #
    # **A hundred rather than ninety**, because ninety was not the notary's
    # budget but the whole job's, and v0.9.3 spent it: twenty-five minutes of
    # build, then a wait that was cut off at thirty with Apple still working.
    # The wait is bounded by `NOTARY_BUDGET_SECONDS` below, and this number is
    # only the outer fence that stops a wedged runner billing for ever.
    timeout-minutes: 100
    env:
      # **No `-Ctarget-feature=+crt-static` here**, which is the one line of the
      # Windows job above that must not be copied. That flag is about the MSVC
      # C runtime; on macOS the C library is `libSystem`, Apple supports no
      # static link against it, and asking for one produces a binary that will
      # not run on a machine that is not this runner.
      RUSTFLAGS: "-D warnings"
      # Where the notarisation tool lives. `xcrun notarytool` needs a full
      # Xcode rather than the command line tools, and the runner has one.
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: Swatinem/rust-cache@v2

      # The same check the Windows job makes, in the shell this runner has.
      - name: The tag is the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          if [ "$tag" != "$version" ]; then
            echo "::error::the tag says $tag and Cargo.toml says $version"
            exit 1
          fi
          echo "building $version"

      - name: Install the Open Fixture Library corpus
        run: tools/fetch-fixtures/fetch-ofl.sh

      - name: Install the interface's dependencies
        working-directory: ui
        run: npm ci

      # ---- The gates, again ----
      # `prism-app` is **included** here, unlike the Linux jobs: a Mac has the
      # webview toolkit in the operating system, so the shell is linted,
      # documented and tested on this runner exactly as it is on the Windows one.
      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Document
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --no-deps

      # The whole workspace, on a second platform with real platform code in it.
      # This is what holds the macOS halves of `prism-protocols::system`,
      # `prismd::secrets` and `prism_app::autostart` — the login keychain test
      # among them, which needs the runner's own keychain and gets it.
      # **Two wall-clock tests are skipped here, and only here.** They measure
      # the tick against a millisecond budget over three seconds, and a GitHub
      # macOS runner is three virtual cores shared with every other test binary
      # `cargo test` runs in parallel: it measured medians of 5.1 ms and 6.1 ms
      # on code that measures 100 µs on real hardware.
      #
      # They are **not** loosened, which this repository has already tried three
      # times — `tests/realtime.rs` records a tail bound going 5 ms, 16 ms, one
      # tick period, 210 ms, each time on a commit that changed nothing. A bound
      # that survives a machine we do not control is a bound that catches
      # nothing on one we do.
      #
      # So they keep their budgets and run where the numbers mean something:
      # on the developer's machine before every push (`cargo test --workspace`
      # with no skips), and in the ten-minute release-profile runs that
      # `prism-engine`'s crate documentation gives the command for. The engine's
      # other 330 tests, including every allocation gate, run here unchanged.
      - name: Test
        run: >
          cargo test --workspace --
          --skip the_tick_holds_its_deadline_for_a_few_seconds
          --skip the_whole_pipeline_fits_inside_a_tick_period

      - name: Typecheck the interface
        working-directory: ui
        run: npx tsc -b --force

      - name: Lint the interface
        working-directory: ui
        run: npm run lint

      - name: Test the interface
        working-directory: ui
        run: npm run test

      # ---- The certificate ----
      # **A keychain of this job's own, thrown away with the runner.** The
      # certificate is never written to the default login keychain: a temporary
      # one that is deleted in a step that always runs is what keeps a private
      # key from outliving the job on a reused runner.
      #
      # `APPLE_CERTIFICATE` is the base64 of a `.p12` holding the **Developer ID
      # Application** certificate *and* its private key, and
      # `APPLE_CERTIFICATE_PASSWORD` is what that `.p12` was exported under.
      # `docs/manual/apple_developer_signing.md` §5 is how both are made.
      # **Both questions are asked here, in a step, and neither in an `if:`.**
      # The `secrets` context is not one of the contexts GitHub makes available
      # to a step's `if:` — it evaluates to nothing there, so
      # `secrets.APPLE_ID != ''` would be true on a runner with no Apple ID and
      # the notarisation step would run and fail. Reading them into `env` and
      # publishing two plain outputs is what makes the conditions below mean
      # what they say.
      - name: Is there a certificate
        id: signing
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_SIGNING_IDENTITY" ]; then
            echo "signing=true" >> "$GITHUB_OUTPUT"
            echo "this build will be signed"
          else
            echo "signing=false" >> "$GITHUB_OUTPUT"
            echo "::warning::no Apple certificate in the secrets; building an UNSIGNED bundle"
          fi
          # Notarisation needs a second set of credentials, and a build can
          # legitimately be signed without them — a signed but un-notarised
          # bundle opens with a right-click, where an unsigned one does not
          # open at all. So the two are separate answers.
          if [ -n "$APPLE_ID" ] && [ -n "$APPLE_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            echo "notarising=true" >> "$GITHUB_OUTPUT"
            echo "this build will be notarised"
          else
            echo "notarising=false" >> "$GITHUB_OUTPUT"
            echo "::warning::no Apple ID in the secrets; the bundle will NOT be notarised"
          fi

      - name: Import the certificate
        if: steps.signing.outputs.signing == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          # A password for the throwaway keychain itself. It never leaves this
          # step's process and the keychain is deleted at the end of the job.
          keychain_password=$(uuidgen)
          echo "KEYCHAIN_PASSWORD=$keychain_password" >> "$GITHUB_ENV"

          security create-keychain -p "$keychain_password" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$keychain_password" build.keychain
          # Without this the keychain re-locks after five minutes of idling and
          # a long `cargo build` finishes into a signing step that cannot reach
          # the key. `-t 3600 -u` is the whole fix and it is easy to leave out.
          security set-keychain-settings -t 3600 -u build.keychain

          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security import certificate.p12 \
            -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          rm -f certificate.p12

          # `codesign` must be able to use the key without a interactive prompt,
          # which on a headless runner would simply hang until the timeout.
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" build.keychain >/dev/null

          echo "the keychain holds:"
          security find-identity -v -p codesigning build.keychain

      # ---- The build ----
      # The daemon first and in release, because the bundle carries it as a
      # resource: `prism_app::spawn::daemon_beside` looks for `prismd` beside
      # the executable inside `PrismDMX.app/Contents/`, and so does the fixture
      # library's own search.
      - name: Build the engine
        run: cargo build --release -p prismd

      # **Signed here, before the bundler copies it in** — S63, and found by
      # signing a bundle locally and looking at what came out.
      #
      # Tauri signs the `.app` and the `.dmg`. It does **not** sign an
      # executable it carried in as a *resource*: `prismd` arrived in
      # `Contents/Resources/` still `adhoc, linker-signed`, which is what the
      # linker leaves and not a signature by anybody. A hardened, notarised
      # bundle with an ad-hoc nested executable is exactly what Apple rejects
      # — *the binary is not signed with a valid Developer ID certificate* —
      # and what Gatekeeper refuses to execute at the far end.
      #
      # Signing it **first** is the ordinary inside-out order: the signature
      # travels with the file when the bundler copies it, and Tauri then seals
      # the app around it. Verified locally: the engine keeps its authority and
      # its hardened runtime through bundling.
      #
      # `--options runtime` is the hardened runtime, which notarisation
      # requires of **every** executable and not only the outer one;
      # `--timestamp` is a trusted timestamp, without which a signature stops
      # verifying once the certificate expires.
      - name: Sign the engine
        if: steps.signing.outputs.signing == 'true'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          codesign --force --options runtime --timestamp \
            --sign "$APPLE_SIGNING_IDENTITY" target/release/prismd
          codesign --display --verbose=2 target/release/prismd

      # `tauri.bundle.macos.conf.json` rather than `tauri.bundle.conf.json`:
      # the Windows one names `prismd.exe` and asks the bundler for an `nsis`
      # target, neither of which exists here.
      #
      # **`APPLE_SIGNING_IDENTITY` and nothing else, so this step only signs.**
      # Tauri's bundler notarises by itself the moment it is also given
      # `APPLE_ID`, `APPLE_PASSWORD` and `APPLE_TEAM_ID` — and it was, which
      # notarised the `.app` here and then the `.dmg` again two steps down.
      # Two submissions for one release, of which only the second is any use:
      # what an operator downloads is the disk image, and a stapled disk image
      # already vouches for everything inside it.
      #
      # The first run this way sat in `Notarizing …` for **thirty-five
      # minutes** before it was cancelled. That is the other half of the
      # reason: Tauri's call is `--wait` with **no timeout**, so a slow or
      # wedged submission would spend the job's full ninety minutes — on the
      # runner billed at ten times a Linux one. The explicit step below passes
      # `--timeout 30m` and gives up in words.
      - name: Build the bundle
        working-directory: crates/prism-app
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: ../../ui/node_modules/.bin/tauri build --config tauri.bundle.macos.conf.json

      # What a person is about to download, asked of the bundle itself. A
      # configuration without the payload in it bundles perfectly happily and
      # produces a program that cannot find its own engine.
      - name: What the bundle contains
        run: |
          set -euo pipefail
          app=target/release/bundle/macos/PrismDMX.app
          test -d "$app" || { echo "::error::no .app was produced"; exit 1; }
          for needed in \
            "Contents/MacOS/PrismDMX" \
            "Contents/Resources/prismd" \
            "Contents/Resources/profiles/surface/xtouch.json" \
            "Contents/Resources/profiles/fixtures/ofl/manufacturers.json"
          do
            test -e "$app/$needed" || {
              echo "::error::the bundle does not carry $needed"; exit 1; }
            echo "carries $needed"
          done
          # The engine has to be executable after the bundler has copied it.
          test -x "$app/Contents/Resources/prismd" || {
            echo "::error::the engine in the bundle is not executable"; exit 1; }

      # **The step that refuses the third state.** A run with a certificate that
      # produced an unsigned bundle is worse than one with no certificate,
      # because the artefact looks finished. So when signing was asked for, the
      # signature is verified rather than assumed — on the nested engine as well
      # as on the app, since an unsigned helper inside a hardened bundle is
      # exactly what Gatekeeper refuses at the far end.
      - name: Verify the signature
        if: steps.signing.outputs.signing == 'true'
        run: |
          set -euo pipefail
          app=target/release/bundle/macos/PrismDMX.app
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign --display --verbose=4 "$app" 2>&1 | grep -E 'Authority|TeamIdentifier|flags'
          # `runtime` in the flags is the hardened runtime, which notarisation
          # requires and which a signature made without `--options runtime`
          # silently lacks.
          codesign --display --verbose=2 "$app" 2>&1 | grep -q 'flags=.*runtime' || {
            echo "::error::the bundle is signed without the hardened runtime"; exit 1; }
          # **`--verify` is not enough here, and that is the point.** An
          # `adhoc, linker-signed` binary is *valid* and *satisfies its
          # designated requirement*, so verifying alone passes on an engine
          # nobody signed — which is what S63's first locally signed bundle
          # actually contained. So the **authority and the flags** are asked
          # for, which ad-hoc has neither of.
          codesign --verify --strict --verbose=2 "$app/Contents/Resources/prismd"
          engine=$(codesign --display --verbose=2 "$app/Contents/Resources/prismd" 2>&1)
          echo "$engine"
          if echo "$engine" | grep -q 'adhoc'; then
            echo "::error::the engine inside the bundle is ad-hoc signed, not signed by us"
            exit 1
          fi
          echo "$engine" | grep -q 'Authority=Developer ID Application' || {
            echo "::error::the engine inside the bundle carries no Developer ID authority"
            exit 1
          }
          echo "$engine" | grep -qE 'flags=.*runtime' || {
            echo "::error::the engine inside the bundle has no hardened runtime"
            exit 1
          }
          echo "the engine inside the bundle is signed, hardened and ours"

      # ---- Notarisation ----
      # **The one notarisation of the release, and it is the disk image's.**
      # The step above is given no Apple ID, so Tauri signs and stops; this is
      # where the `.dmg` is submitted, and a stapled disk image vouches for the
      # `.app` inside it as well. Stapling is the part Tauri would not do even
      # when it did notarise: an unstapled image needs the network every time
      # somebody opens it, which in a hall with no internet is a file that does
      # not open.
      # **Uploaded before the notarisation, and that ordering is the point.**
      # The signed image is finished work: twenty-five minutes of build and a
      # signature that `Verify the signature` has already checked. Apple's
      # notary service is the one part of this job that can take an
      # unpredictable time — the v0.9.3 run sat `In Progress` for the full
      # thirty minutes — and a timeout there used to throw the image away with
      # it. Now a timed-out run still leaves a downloadable artefact, and a
      # ticket that finishes later can be stapled onto it by hand
      # (`xcrun stapler staple`) without building anything again.
      #
      # It is **not** attached to the release here: what goes on a release page
      # is stapled or it is not offered.
      - uses: actions/upload-artifact@v4
        with:
          name: prismdmx-macos
          path: target/release/bundle/dmg/*.dmg
          retention-days: 14

      - name: Notarise and staple the disk image
        if: steps.signing.outputs.notarising == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # **The whole budget for Apple's answer**, in seconds, and the one
          # number to change when this step times out again. Forty-five minutes
          # rather than the thirty that killed v0.9.3: that run was `In
          # Progress` when it was cut off, and the run before it had sat in
          # Tauri's own unbounded wait for thirty-five — twice in a row past
          # thirty, from an account whose first submissions these were, which is
          # where Apple's queue is at its slowest.
          #
          # It is bounded rather than generous because a macOS runner minute is
          # the dearest of the three and these are minutes spent asleep. The job
          # reaches this step about twenty-five minutes in, so forty-five here
          # and a hundred above leave room for the build to be slower than
          # usual and still reach a verdict.
          NOTARY_BUDGET_SECONDS: "2700"
        run: |
          set -euo pipefail
          # The disk image, located the way the Windows job locates the
          # installer: **named, and refused when it is not there.** `ls | head -1`
          # would hand an empty string to the next command and fail somewhere
          # less obvious — a bundler given no payload exits zero happily, which
          # is the whole reason these steps exist.
          shopt -s nullglob
          images=(target/release/bundle/dmg/*.dmg)
          if [ ${#images[@]} -eq 0 ]; then
            echo "::error::no disk image was produced"
            exit 1
          fi
          dmg="${images[0]}"

          # **Submitted without `--wait`, and the id read back before anything
          # else can go wrong.** `--wait` folds three outcomes into one exit
          # code — accepted, refused, and *still queued* — and the one it
          # handles worst is the one that actually happened to v0.9.3: the wait
          # ran out at thirty minutes, the process died with the submission id
          # only in its own log output, and a verdict Apple reached minutes
          # later could not be collected. Submitting and polling separately
          # keeps the id in a variable, so every branch below can name it.
          # `--output-format json` puts the tool's own complaint on standard
          # output, where `$(…)` swallows it — so the upload is tested by hand
          # rather than left to `set -e`, which would end the step in silence
          # on the one failure a person could actually fix: a bad app-specific
          # password or the wrong team.
          if ! submission=$(xcrun notarytool submit "$dmg" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --output-format json)
          then
            echo "::error::the notary service refused the upload: $submission"
            exit 1
          fi
          id=$(printf '%s' "$submission" | jq -r '.id // empty')
          if [ -z "$id" ]; then
            echo "::error::the notary service named no submission id: $submission"
            exit 1
          fi
          echo "::notice::notarisation submission $id for $(basename "$dmg")"

          # **The poll, and what each answer means.**
          #
          # `In Progress` is a queue at Apple's end that nobody here controls,
          # so it is waited out to the budget above and no further. `Accepted`
          # is the only way on. Anything else — `Invalid`, `Rejected` — is a
          # **verdict rather than a delay**: the log is printed and the step
          # stops there, instead of spending three quarters of an hour waiting
          # for an answer that has already been given. That distinction is the
          # point of polling; `--wait` could not make it.
          #
          # A call that fails to answer at all is treated as `In Progress`
          # rather than as a verdict, because a dropped connection to Apple is
          # not a judgement about the disk image. It costs a poll interval and
          # the budget still bounds it.
          started=$SECONDS
          deadline=$(( SECONDS + NOTARY_BUDGET_SECONDS ))
          while :; do
            info=$(xcrun notarytool info "$id" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --output-format json 2>/dev/null) || info=""
            status=$(printf '%s' "$info" | jq -r '.status // empty' 2>/dev/null) || status=""
            if [ -z "$status" ]; then
              status="In Progress"
              echo "  (the notary service did not answer; still waiting)"
            fi
            echo "$(( SECONDS - started ))s  notarisation $id: $status"
            case "$status" in
              Accepted)
                break
                ;;
              "In Progress")
                ;;
              *)
                echo "::error::the notary service refused the disk image ($status). This is a verdict, not a wait that ran out — the log follows and the image must be fixed rather than resubmitted."
                xcrun notarytool log "$id" \
                  --apple-id "$APPLE_ID" \
                  --password "$APPLE_PASSWORD" \
                  --team-id "$APPLE_TEAM_ID" || true
                exit 1
                ;;
            esac
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::notarisation did not finish inside ${NOTARY_BUDGET_SECONDS}s. This is a wait that ran out, not a rejection: submission $id is still with Apple. The signed disk image is uploaded as the prismdmx-macos artefact; read the verdict later with \`xcrun notarytool log $id\` and staple it onto that file with \`xcrun stapler staple\` rather than building it again."
              exit 1
            fi
            sleep 30
          done

          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          # The last word belongs to Gatekeeper rather than to us: this is the
          # same check the operator's Mac makes when they open the file.
          spctl --assess --type open --context context:primary-signature -vv "$dmg"

      - name: Checksum
        id: bundle
        run: |
          set -euo pipefail
          # The disk image, located the way the Windows job locates the
          # installer: **named, and refused when it is not there.** `ls | head -1`
          # would hand an empty string to the next command and fail somewhere
          # less obvious — a bundler given no payload exits zero happily, which
          # is the whole reason these steps exist.
          shopt -s nullglob
          images=(target/release/bundle/dmg/*.dmg)
          if [ ${#images[@]} -eq 0 ]; then
            echo "::error::no disk image was produced"
            exit 1
          fi
          dmg="${images[0]}"
          hash=$(shasum -a 256 "$dmg" | cut -d' ' -f1)
          {
            echo "path=$dmg"
            echo "name=$(basename "$dmg")"
            echo "sha256=$hash"
          } >> "$GITHUB_OUTPUT"
          echo "$(basename "$dmg")  $hash"


      # The disk image is **added** to the release the Windows job created, not
      # a release of its own. `softprops/action-gh-release` updates an existing
      # release when the tag already has one, and the two jobs run in parallel —
      # so `files` names only this job's artefact and every field that the
      # Windows job owns is left out, which is what stops one job's notes from
      # overwriting the other's.
      - name: Add the disk image to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.bundle.outputs.path }}

      # **Always**, including when a step above failed: a private key left in a
      # keychain on a runner is the thing this cleans up, and a job that only
      # tidied after a success would leave one behind on exactly the runs where
      # something went wrong.
      - name: Take the keychain away
        if: always()
        run: |
          security delete-keychain build.keychain 2>/dev/null || true
          rm -f certificate.p12
