# CI matrix per ARCHITECTURE_SPEC.md section 10.1.
#
# Windows is the release target and gets the full treatment. Linux runs the
# platform-neutral crates and a cross-compile check so the Raspberry Pi path
# cannot rot unnoticed - a portability break should fail on the commit that
# caused it, not a year later. macOS is deliberately absent until it becomes
# a priority (decision D10).

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  windows:
    name: Windows - full build and test
    runs-on: windows-latest
    # A hung test costs a whole job otherwise. S16 pushed one that blocked on a
    # message a two-core runner never delivered, and the run sat there until it
    # was cancelled by hand; the fix was in the test, and this is so the next
    # one of those fails inside the hour instead of after six.
    #
    # Raised from 20 in S29, and for a reason rather than because it was tight:
    # `--workspace` now includes `prism-app`, so a cold cache compiles the whole
    # Tauri dependency tree before a single test runs.
    timeout-minutes: 45
    env:
      # RUSTFLAGS from the environment replaces .cargo/config.toml's rustflags
      # rather than adding to them, so the static C runtime has to be asked for
      # again here. Everything on Windows is linked against it since S29, so
      # that FTDI's statically linked D2XX library, WebView2's static loader and
      # the rest of the build all agree - and so that nothing has to be
      # installed alongside the desk. The reasoning is written out in
      # .cargo/config.toml.
      RUSTFLAGS: "-D warnings -Ctarget-feature=+crt-static"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # S41. The crate documentation is a large part of what this project knows,
      # and until this session nothing had ever rendered it - a broken
      # intra-doc link is a paragraph nobody will read, and there were thirty of
      # them. `RUSTDOCFLAGS` rather than `RUSTFLAGS`, because rustdoc reads its
      # own variable and the job's `-D warnings` never reached it.
      #
      # Here rather than in the Linux job because this is the one that builds
      # `prism-app`: the shell needs a webview toolkit the neutral jobs have no
      # business installing, and `--workspace` is the whole claim.
      - name: Document
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --no-deps

      # The Open Fixture Library, which is **downloaded at install time and not
      # committed** (S44, profiles/fixtures/SOURCE.md). Fetched here so the
      # corpus tests run against the real thing rather than skipping themselves:
      # 634 fixtures is the input no hand-written JSON can stand in for.
      - name: Install the fixture library
        shell: pwsh
        run: tools/fetch-fixtures/fetch-fixtures.ps1

      - name: Build
        run: cargo build --workspace

      - name: Test
        run: cargo test --workspace

  linux-neutral:
    name: Linux - platform-neutral crates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # These crates must never contain #[cfg(target_os = ...)]. Running their
      # tests on a second platform is what proves it.
      #
      # prismd is in the list from S17 for exactly that reason: section 10.1
      # does not name it, so the daemon has none - and the three places it would
      # otherwise have needed some (the user data directory, the tick thread's
      # priority, the IPC endpoint) are resolved from the environment, from a
      # dependency, and from prism-ipc respectively. Its tests here run against
      # a Unix domain socket where the Windows job runs them against a named
      # pipe, which is what keeps that claim honest.
      #
      # prism-protocols is the exception that has to be here anyway: section
      # 10.1 does allow it platform code, but only for backend selection - the
      # DMX logic above the FtdiBackend trait must stay neutral, and every one
      # of its tests runs against a mock with no hardware attached. If a real
      # backend ever fails to build on Linux, that belongs behind a #[cfg]
      # rather than behind removing this line.
      # The Open Fixture Library, which is **downloaded at install time and not
      # committed** (S44, profiles/fixtures/SOURCE.md). Fetched here so the
      # corpus tests run against the real thing rather than skipping themselves:
      # 634 fixtures is the input no hand-written JSON can stand in for.
      - name: Install the fixture library
        run: tools/fetch-fixtures/fetch-fixtures.sh

      - name: Test platform-neutral crates
        run: >
          cargo test
          -p prism-domain
          -p prism-engine
          -p prism-core
          -p prism-surface
          -p prism-ipc
          -p prism-protocols
          -p prismd
          -p prism-web

  linux-arm64-check:
    name: Linux ARM64 - cross-compile check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2

      # `cargo check` does not link, so no cross-linker is needed - but since
      # S15 the workspace contains C: prism-core depends on rusqlite with the
      # bundled SQLite amalgamation, and a build script has to *compile*
      # sqlite3.c for the target even when nothing is linked. Without a cross
      # compiler cc-rs stops with "failed to find tool aarch64-linux-gnu-gcc",
      # which is a missing toolchain rather than a portability break, and the
      # difference matters: this job exists to catch the second.
      #
      # The reasoning behind accepting a C dependency at all - and what the
      # alternatives were - is in PROGRESS.md's decision log under S15.
      #
      # `apt-get update` talks to the Ubuntu mirrors, and on 2026-08-19 they
      # stopped answering: `azure.archive.ubuntu.com` returned nothing, apt fell
      # back to `archive.ubuntu.com`, fetched three index files and then sat
      # silent until the job was killed. It cost this job ten minutes and the
      # end-to-end job twenty-two, and neither had anything to do with the code.
      #
      # So the update is no longer on the path when it is not needed. The runner
      # image ships package lists, and `gcc-aarch64-linux-gnu` is an ordinary
      # package in them, so the plain install is tried first. Only if that fails
      # is the index refreshed, and every step is under a timeout: a stalled
      # mirror now costs a minute and says so, instead of consuming the job.
      - name: Cross C toolchain
        run: |
          if timeout 120 sudo apt-get install -y gcc-aarch64-linux-gnu; then
            exit 0
          fi
          echo "the cached package lists were not enough; refreshing the index"
          for attempt in 1 2 3; do
            if timeout 180 sudo apt-get update \
              && timeout 300 sudo apt-get install -y gcc-aarch64-linux-gnu; then
              exit 0
            fi
            echo "attempt $attempt failed; the Ubuntu mirrors may be down"
            sleep 15
          done
          echo "::error::could not install the cross C toolchain after three tries"
          exit 1

      # This catches the realistic failure - platform-specific code leaking
      # into a crate that is supposed to be neutral.
      #
      # `prism-app` is excluded, and that exclusion **is** section 10.1 rather
      # than an exception to it (S29). The shell is one of the four crates the
      # rule allows platform code, it is the only one whose platform code is the
      # whole point of it, and building it needs a webview toolkit this job has
      # no business installing. What the job is for is catching platform code
      # leaking into a crate that is supposed to be neutral - and the shell is
      # the crate it is supposed to leak *into*. Everything below it is still
      # checked here, which is the claim that matters.
      - name: Check
        run: cargo check --workspace --exclude prism-app --target aarch64-unknown-linux-gnu

  shell:
    name: Windows - the desktop shell and its installer
    runs-on: windows-latest
    # A release build of the daemon plus a webview bundle, both with LTO and one
    # codegen unit. It is a job of its own so the fast checks are not held up
    # behind it, and it is here at all because an installer that only ever
    # builds on one person's machine is a file rather than a release (S29).
    timeout-minutes: 60
    env:
      # As in the Windows job above, and for the reason .cargo/config.toml
      # gives: RUSTFLAGS from the environment replaces its rustflags rather
      # than adding to them.
      RUSTFLAGS: "-D warnings -Ctarget-feature=+crt-static"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: Swatinem/rust-cache@v2

      # The bundle carries the library as a resource, so it has to be here
      # before the bundler looks for it (S44, profiles/fixtures/SOURCE.md).
      - name: Install the fixture library
        shell: pwsh
        run: tools/fetch-fixtures/fetch-fixtures.ps1

      # ui/src/bindings is generated from Rust rather than committed, and
      # `tauri build` runs `npm run build` for the interface — which will not
      # typecheck without it. The UI job has the same step for the same reason.
      - name: Generate TypeScript bindings
        run: cargo test -p prism-domain

      - name: Install the interface's dependencies
        working-directory: ui
        run: npm ci

      # `prismd.exe` in release, because the bundle carries it beside the shell:
      # `prism_app::spawn::daemon_beside` looks there, and so does
      # `prismd::paths::installed_library_dir` for the profiles.
      - name: Build the engine
        run: cargo build --release -p prismd

      # This also builds the interface - `beforeBuildCommand` in
      # crates/prism-app/tauri.conf.json - and then the shell, and then the
      # NSIS installer.
      # `shell: bash` on purpose. The default on a Windows runner is PowerShell,
      # which will not execute the extensionless shell script npm puts in
      # `node_modules/.bin`; bash is present on every Windows runner and is the
      # same invocation the README gives a developer.
      - name: Build the installer
        working-directory: crates/prism-app
        shell: bash
        run: ../../ui/node_modules/.bin/tauri build --config tauri.bundle.conf.json

      # Not "did it exit zero" but "does the installer carry what an installed
      # desk needs". A bundler given a configuration without the payload in it
      # exits zero perfectly happily and produces an installer that installs a
      # program which cannot find its own engine — which is exactly the failure
      # splitting the configuration in two made possible, so it is exactly the
      # one that gets checked.
      - name: What the installer contains
        shell: pwsh
        run: |
          $setup = Get-ChildItem target/release/bundle/nsis/*-setup.exe |
            Select-Object -First 1
          if (-not $setup) { Write-Error "no installer was produced"; exit 1 }
          Write-Output "$($setup.Name)  $([math]::Round($setup.Length / 1MB, 1)) MB"
          $files = & "$env:ProgramFiles\7-Zip\7z.exe" l $setup.FullName
          foreach ($needed in @(
            "PrismDMX.exe",
            "prismd.exe",
            "profiles\surface\xtouch.json",
            "profiles\fixtures\manufacturers.json"
          )) {
            if (-not ($files -match [regex]::Escape($needed))) {
              Write-Error "the installer does not carry $needed"
              exit 1
            }
            Write-Output "carries $needed"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: prismdmx-installer-ci
          path: target/release/bundle/nsis/*-setup.exe
          retention-days: 7

  ui:
    name: UI - typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # ui/src/bindings is generated, not committed, so it has to exist before
      # anything typechecks. prism-domain's test suite writes it - which also
      # means a binding cannot silently go stale. Since S23 it writes
      # variants.ts as well: the run-time tables a decoder narrows a string
      # with, read back out of the very unions ts-rs generated.
      - name: Generate TypeScript bindings
        working-directory: .
        run: cargo test -p prism-domain

      - name: Install
        run: npm ci

      # `tsc -b`, not `tsc --noEmit`: tsconfig.json is a solution file with no
      # files of its own, so --noEmit on it checks nothing at all. --force
      # because a cached build info file would let a stale error through.
      - name: Typecheck
        run: npx tsc -b --force

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  ui-e2e:
    name: UI - end-to-end against a daemon
    runs-on: ubuntu-latest
    # A daemon has to be compiled, a browser downloaded and a build served, so
    # this one is slower than the rest of the UI job put together. It is a job
    # of its own so the fast checks are not held up behind it.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Generate TypeScript bindings
        working-directory: .
        run: cargo test -p prism-domain

      - name: Install
        run: npm ci

      # The browser binary, cached across runs so a working mirror is needed
      # once rather than every time.
      - name: Cache the browser
        id: browser-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('ui/package-lock.json') }}

      # **Deliberately not `--with-deps`.** That flag runs `apt-get update` and
      # installs Chromium's shared libraries, and `ubuntu-latest` already ships
      # them. What it actually bought was a dependency on the Ubuntu mirrors:
      # on 2026-08-19 `azure.archive.ubuntu.com` stopped answering, apt fell
      # back to `archive.ubuntu.com`, fetched three index files and then sat
      # silent for twenty-two minutes until the job was killed — twice, on two
      # runners, having taken 27 s the run before. Without the flag no apt runs
      # at all. If a library is ever genuinely missing, Chromium fails to launch
      # and the end-to-end tests say so loudly, which is a better failure than a
      # package manager that never returns.
      - name: Install the browser
        run: npx playwright install chromium

      # The Open Fixture Library, which is **downloaded at install time and not
      # committed** (S44, profiles/fixtures/SOURCE.md). Fetched here so the
      # corpus tests run against the real thing rather than skipping themselves:
      # 634 fixtures is the input no hand-written JSON can stand in for.
      - name: Install the fixture library
        working-directory: .
        run: tools/fetch-fixtures/fetch-fixtures.sh

      # The spec builds this itself if it is missing; doing it here means a
      # compile is not spent out of a test's own timeout.
      - name: Build the daemon
        working-directory: .
        run: cargo build -p prismd

      # ARCHITECTURE_SPEC.md section 12: Playwright against a daemon in
      # mock-output mode. The daemon under test is started and *killed* by the
      # spec, because that is the thing being tested - and it drives a mock
      # output, so nothing here touches a device.
      - name: End to end
        run: npm run e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: ui/playwright-report/
          retention-days: 7

  web:
    name: Web - the documentation site
    runs-on: ubuntu-latest
    # Eight pages in two languages — sixteen files — six of them from Markdown
    # this repository already keeps. The whole job is a `cargo build` of one
    # small crate and a run of it.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # S42, and the reason it is a job at all is S29's argument about the
      # installer, one document along: **a site that only builds on one person's
      # machine is the same problem as an installer that only builds on one
      # person's machine.** The site is generated out of this repository so that
      # the documentation cannot drift from a release, and this is what says the
      # generation still works on a machine that is not the author's.
      #
      # No `--installer` here: the checksum on the download page is computed
      # from the file a release built, and this run has built no file. A page
      # that printed a number nobody derived would be the thing generating the
      # site was meant to prevent. `release.yml` is where the flag is passed.
      # **Into `docs-site/`, and the name is the fix rather than a preference.**
      # This was `site/` until S55, when a crate of that name arrived one
      # directory up: the generator then wrote its pages *into the source tree
      # of `prism-site`*, and the check below — which greps the output for a
      # `<script>` — found the front page's own and failed. It would have been
      # worse where it did not fail: `pages.yml` and `release.yml` would have
      # published a crate's sources beside the manuals.
      #
      # An output directory named after nothing in the repository is what stops
      # that from happening again.
      - name: Build the site
        run: cargo run -p prism-web -- --out docs-site

      # Not "did it exit zero" but "is the site the site". The generator's own
      # suite asserts the content; this asserts that a run in a clean checkout
      # produced the files a deployment would serve.
      - name: What was produced
        run: |
          # The root, which belongs to no language and sends the reader on.
          test -f docs-site/index.html
          grep -q 'http-equiv="refresh"' docs-site/index.html
          # Every page, in every language. Listed rather than counted, because a
          # count stays right while two pages swap names.
          for page in "" download manual/operator manual/installer \
                      manual/developer command-line changelog known-faults; do
            test -f "docs-site/en/$page/index.html" || {
              echo "::error::docs-site/en/$page/index.html is missing"; exit 1; }
          done
          for page in "" download handbuch/operator handbuch/installateur \
                      handbuch/entwickler kommandozeile aenderungen fehler; do
            test -f "docs-site/de/$page/index.html" || {
              echo "::error::docs-site/de/$page/index.html is missing"; exit 1; }
          done
          test -f docs-site/CNAME
          if grep -rqi '<script' docs-site; then
            echo "::error::the site has JavaScript on it and is supposed to have none"
            exit 1
          fi
          # No page may ask for a path from the site's root: the site has to work
          # wherever it is mounted, and the first deployment proved that is not
          # theoretical — it went out as a GitHub *project* page under a path
          # prefix, where one `href="/…"` breaks every link on every page while
          # the site still looks finished. The generator's suite asserts this
          # too; it is here as well because this is the artefact that ships.
          if grep -rq 'href="/' docs-site; then
            echo "::error::a page links to a path from the site root"
            grep -rn 'href="/' docs-site | head -5
            exit 1
          fi
          du -sh docs-site
          find docs-site -name index.html | sort

      - uses: actions/upload-artifact@v4
        with:
          name: prismdmx-site
          path: docs-site
          retention-days: 7

  site:
    name: Web - the front page
    runs-on: ubuntu-latest
    # One page and three files it carries. The whole job is a `cargo build` of a
    # crate with no dependencies and a run of it.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # S55, and it is here for the same reason the `web` job above is: **a site
      # that only builds on one person's machine is the same problem as an
      # installer that only builds on one person's machine.**
      #
      # It is a *second* job rather than a second step in that one because the
      # two crates make opposite promises and a shared job would blur them. The
      # documentation site is asserted to have **no** script on it; this one has
      # one on purpose. Two jobs say which is which in their names.
      - name: Build the front page
        run: cargo run -p prism-site -- --out front

      # Not "did it exit zero" but "is the page the page". The crate's own suite
      # asserts what is written; this asserts that a run in a clean checkout
      # produced the files a deployment would serve, and that the one failure a
      # template makes silently did not happen.
      - name: What was produced
        run: |
          test -f front/index.html
          test -f front/site.css
          test -f front/site.js
          test -f front/logo.png
          test -f front/favicon.ico
          # The mark on the page is the one the desk wears, not a redrawing of
          # it. The crate's suite compares the bytes; this says the file that
          # was actually served is the one it compared.
          cmp front/favicon.ico ui/public/favicon.ico
          if grep -rq '{{' front/index.html; then
            echo "::error::a placeholder is still on the page"
            exit 1
          fi
          if ! grep -q "$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)" front/index.html; then
            echo "::error::the page does not name the version this build is"
            exit 1
          fi
          du -sh front
          wc -c front/*

      - uses: actions/upload-artifact@v4
        with:
          name: prismdmx-front
          path: front
          retention-days: 7

  # The container both sites are served from, built the way the server builds
  # it. `deploy/` is the self-hosted path, and an image that only ever builds on
  # the machine it is deployed to is the third shape of the same problem the two
  # jobs above exist for. Nothing is pushed anywhere: the server pulls and
  # builds for itself, because SSH into it is VPN-only.
  container:
    name: Web - the deployment container
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - name: Build the image
        run: docker build -f deploy/Dockerfile -t prismdmx-web:ci .

      # A configuration that parses is not a configuration that answers. What is
      # asserted is the one thing the two vhosts are for: the same port tells
      # the two sites apart by the `Host` header, and an unknown host gets
      # neither of them.
      - name: Does it serve both names
        run: |
          docker run -d --name prismdmx-ci -p 127.0.0.1:8080:80 prismdmx-web:ci
          for _ in $(seq 30); do
            curl -sf -o /dev/null -H 'Host: prismdmx.de' http://127.0.0.1:8080/ && break
            sleep 1
          done
          front=$(curl -s -H 'Host: prismdmx.de' http://127.0.0.1:8080/)
          echo "$front" | grep -q 'Lichtpult' \
            || { echo '::error::prismdmx.de did not serve the front page'; exit 1; }

          # The documentation site's root belongs to no language and sends the
          # reader on; the manuals themselves live one segment down. Asking the
          # root for the word "Handbuch" is what this check used to do, and it
          # stopped meaning anything the moment the site gained a second
          # language — so it asks for the redirect, and then for each language's
          # index, and then for one page deep inside each. That last pair is the
          # one that exercises nginx's `try_files … $uri/index.html`, which is
          # the only part of the vhost the page layout can break.
          docs=$(curl -s -H 'Host: docs.prismdmx.de' http://127.0.0.1:8080/)
          echo "$docs" | grep -q 'url=en/' \
            || { echo '::error::the documentation root does not send the reader to a language'; exit 1; }
          for probe in "en/:Operator" "de/:Handbuch" \
                       "en/manual/operator/:Operator" "de/handbuch/operator/:Handbuch"; do
            path="${probe%%:*}"; want="${probe##*:}"
            curl -s -H 'Host: docs.prismdmx.de' "http://127.0.0.1:8080/$path" | grep -q "$want" \
              || { echo "::error::docs.prismdmx.de/$path did not serve the manuals"; exit 1; }
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: example.invalid' http://127.0.0.1:8080/)" = 404             || { echo '::error::an unknown host was served a page'; exit 1; }
          # The front page ships a real `/favicon.ico` and the manuals do not.
          # A `location = /favicon.ico` that answered 204 for both swallowed the
          # file that was sitting right there, and nothing said so — the tab was
          # simply blank. Found with `curl` against the running server rather
          # than by a test, so it is a check now.
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: prismdmx.de' http://127.0.0.1:8080/favicon.ico)" = 200             || { echo '::error::the front page did not serve its own favicon'; exit 1; }
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: docs.prismdmx.de' http://127.0.0.1:8080/favicon.ico)" = 204             || { echo '::error::the manuals should answer 204 rather than log a 404'; exit 1; }
          docker rm -f prismdmx-ci
