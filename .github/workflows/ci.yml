# CI matrix per ARCHITECTURE_SPEC.md section 10.1.
#
# Windows is the release target and gets the full treatment. Linux runs the
# platform-neutral crates and a cross-compile check so the Raspberry Pi path
# cannot rot unnoticed - a portability break should fail on the commit that
# caused it, not a year later. macOS is deliberately absent until it becomes
# a priority (decision D10).

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  windows:
    name: Windows - full build and test
    runs-on: windows-latest
    # A hung test costs a whole job otherwise. S16 pushed one that blocked on a
    # message a two-core runner never delivered, and the run sat there until it
    # was cancelled by hand; the fix was in the test, and this is so the next
    # one of those fails in twenty minutes instead of six hours.
    timeout-minutes: 20
    env:
      # RUSTFLAGS from the environment replaces .cargo/config.toml's rustflags
      # rather than adding to them, so the link argument has to be repeated
      # here. It excludes the static C runtime that FTDI's statically linked
      # D2XX library asks for; without it the linker reports LNK4098, which is
      # a rustc lint and therefore an error under -D warnings. The reasoning is
      # written out in .cargo/config.toml.
      RUSTFLAGS: "-D warnings -Clink-arg=/NODEFAULTLIB:LIBCMT"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The Open Fixture Library, which is **downloaded at install time and not
      # committed** (S44, profiles/fixtures/SOURCE.md). Fetched here so the
      # corpus tests run against the real thing rather than skipping themselves:
      # 634 fixtures is the input no hand-written JSON can stand in for.
      - name: Install the fixture library
        shell: pwsh
        run: tools/fetch-fixtures/fetch-fixtures.ps1

      - name: Build
        run: cargo build --workspace

      - name: Test
        run: cargo test --workspace

  linux-neutral:
    name: Linux - platform-neutral crates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # These crates must never contain #[cfg(target_os = ...)]. Running their
      # tests on a second platform is what proves it.
      #
      # prismd is in the list from S17 for exactly that reason: section 10.1
      # does not name it, so the daemon has none - and the three places it would
      # otherwise have needed some (the user data directory, the tick thread's
      # priority, the IPC endpoint) are resolved from the environment, from a
      # dependency, and from prism-ipc respectively. Its tests here run against
      # a Unix domain socket where the Windows job runs them against a named
      # pipe, which is what keeps that claim honest.
      #
      # prism-protocols is the exception that has to be here anyway: section
      # 10.1 does allow it platform code, but only for backend selection - the
      # DMX logic above the FtdiBackend trait must stay neutral, and every one
      # of its tests runs against a mock with no hardware attached. If a real
      # backend ever fails to build on Linux, that belongs behind a #[cfg]
      # rather than behind removing this line.
      # The Open Fixture Library, which is **downloaded at install time and not
      # committed** (S44, profiles/fixtures/SOURCE.md). Fetched here so the
      # corpus tests run against the real thing rather than skipping themselves:
      # 634 fixtures is the input no hand-written JSON can stand in for.
      - name: Install the fixture library
        run: tools/fetch-fixtures/fetch-fixtures.sh

      - name: Test platform-neutral crates
        run: >
          cargo test
          -p prism-domain
          -p prism-engine
          -p prism-core
          -p prism-surface
          -p prism-ipc
          -p prism-protocols
          -p prismd

  linux-arm64-check:
    name: Linux ARM64 - cross-compile check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2

      # `cargo check` does not link, so no cross-linker is needed - but since
      # S15 the workspace contains C: prism-core depends on rusqlite with the
      # bundled SQLite amalgamation, and a build script has to *compile*
      # sqlite3.c for the target even when nothing is linked. Without a cross
      # compiler cc-rs stops with "failed to find tool aarch64-linux-gnu-gcc",
      # which is a missing toolchain rather than a portability break, and the
      # difference matters: this job exists to catch the second.
      #
      # The reasoning behind accepting a C dependency at all - and what the
      # alternatives were - is in PROGRESS.md's decision log under S15.
      - name: Cross C toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      # This catches the realistic failure - platform-specific code leaking
      # into a crate that is supposed to be neutral.
      - name: Check
        run: cargo check --workspace --target aarch64-unknown-linux-gnu

  ui:
    name: UI - typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # ui/src/bindings is generated, not committed, so it has to exist before
      # anything typechecks. prism-domain's test suite writes it - which also
      # means a binding cannot silently go stale. Since S23 it writes
      # variants.ts as well: the run-time tables a decoder narrows a string
      # with, read back out of the very unions ts-rs generated.
      - name: Generate TypeScript bindings
        working-directory: .
        run: cargo test -p prism-domain

      - name: Install
        run: npm ci

      # `tsc -b`, not `tsc --noEmit`: tsconfig.json is a solution file with no
      # files of its own, so --noEmit on it checks nothing at all. --force
      # because a cached build info file would let a stale error through.
      - name: Typecheck
        run: npx tsc -b --force

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  ui-e2e:
    name: UI - end-to-end against a daemon
    runs-on: ubuntu-latest
    # A daemon has to be compiled, a browser downloaded and a build served, so
    # this one is slower than the rest of the UI job put together. It is a job
    # of its own so the fast checks are not held up behind it.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Generate TypeScript bindings
        working-directory: .
        run: cargo test -p prism-domain

      - name: Install
        run: npm ci

      # The browser binary, cached across runs so a working mirror is needed
      # once rather than every time.
      - name: Cache the browser
        id: browser-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('ui/package-lock.json') }}

      # **Deliberately not `--with-deps`.** That flag runs `apt-get update` and
      # installs Chromium's shared libraries, and `ubuntu-latest` already ships
      # them. What it actually bought was a dependency on the Ubuntu mirrors:
      # on 2026-08-19 `azure.archive.ubuntu.com` stopped answering, apt fell
      # back to `archive.ubuntu.com`, fetched three index files and then sat
      # silent for twenty-two minutes until the job was killed — twice, on two
      # runners, having taken 27 s the run before. Without the flag no apt runs
      # at all. If a library is ever genuinely missing, Chromium fails to launch
      # and the end-to-end tests say so loudly, which is a better failure than a
      # package manager that never returns.
      - name: Install the browser
        run: npx playwright install chromium

      # The Open Fixture Library, which is **downloaded at install time and not
      # committed** (S44, profiles/fixtures/SOURCE.md). Fetched here so the
      # corpus tests run against the real thing rather than skipping themselves:
      # 634 fixtures is the input no hand-written JSON can stand in for.
      - name: Install the fixture library
        working-directory: .
        run: tools/fetch-fixtures/fetch-fixtures.sh

      # The spec builds this itself if it is missing; doing it here means a
      # compile is not spent out of a test's own timeout.
      - name: Build the daemon
        working-directory: .
        run: cargo build -p prismd

      # ARCHITECTURE_SPEC.md section 12: Playwright against a daemon in
      # mock-output mode. The daemon under test is started and *killed* by the
      # spec, because that is the thing being tested - and it drives a mock
      # output, so nothing here touches a device.
      - name: End to end
        run: npm run e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: ui/playwright-report/
          retention-days: 7
