# CI matrix per ARCHITECTURE_SPEC.md section 10.1.
#
# Windows is the release target and gets the full treatment. Linux runs the
# platform-neutral crates and a cross-compile check so the Raspberry Pi path
# cannot rot unnoticed - a portability break should fail on the commit that
# caused it, not a year later. macOS is deliberately absent until it becomes
# a priority (decision D10).

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  windows:
    name: Windows - full build and test
    runs-on: windows-latest
    # A hung test costs a whole job otherwise. S16 pushed one that blocked on a
    # message a two-core runner never delivered, and the run sat there until it
    # was cancelled by hand; the fix was in the test, and this is so the next
    # one of those fails in twenty minutes instead of six hours.
    timeout-minutes: 20
    env:
      # RUSTFLAGS from the environment replaces .cargo/config.toml's rustflags
      # rather than adding to them, so the link argument has to be repeated
      # here. It excludes the static C runtime that FTDI's statically linked
      # D2XX library asks for; without it the linker reports LNK4098, which is
      # a rustc lint and therefore an error under -D warnings. The reasoning is
      # written out in .cargo/config.toml.
      RUSTFLAGS: "-D warnings -Clink-arg=/NODEFAULTLIB:LIBCMT"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace

      - name: Test
        run: cargo test --workspace

  linux-neutral:
    name: Linux - platform-neutral crates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # These crates must never contain #[cfg(target_os = ...)]. Running their
      # tests on a second platform is what proves it.
      #
      # prismd is in the list from S17 for exactly that reason: section 10.1
      # does not name it, so the daemon has none - and the three places it would
      # otherwise have needed some (the user data directory, the tick thread's
      # priority, the IPC endpoint) are resolved from the environment, from a
      # dependency, and from prism-ipc respectively. Its tests here run against
      # a Unix domain socket where the Windows job runs them against a named
      # pipe, which is what keeps that claim honest.
      #
      # prism-protocols is the exception that has to be here anyway: section
      # 10.1 does allow it platform code, but only for backend selection - the
      # DMX logic above the FtdiBackend trait must stay neutral, and every one
      # of its tests runs against a mock with no hardware attached. If a real
      # backend ever fails to build on Linux, that belongs behind a #[cfg]
      # rather than behind removing this line.
      - name: Test platform-neutral crates
        run: >
          cargo test
          -p prism-domain
          -p prism-engine
          -p prism-core
          -p prism-surface
          -p prism-ipc
          -p prism-protocols
          -p prismd

  linux-arm64-check:
    name: Linux ARM64 - cross-compile check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2

      # `cargo check` does not link, so no cross-linker is needed - but since
      # S15 the workspace contains C: prism-core depends on rusqlite with the
      # bundled SQLite amalgamation, and a build script has to *compile*
      # sqlite3.c for the target even when nothing is linked. Without a cross
      # compiler cc-rs stops with "failed to find tool aarch64-linux-gnu-gcc",
      # which is a missing toolchain rather than a portability break, and the
      # difference matters: this job exists to catch the second.
      #
      # The reasoning behind accepting a C dependency at all - and what the
      # alternatives were - is in PROGRESS.md's decision log under S15.
      - name: Cross C toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      # This catches the realistic failure - platform-specific code leaking
      # into a crate that is supposed to be neutral.
      - name: Check
        run: cargo check --workspace --target aarch64-unknown-linux-gnu

  ui:
    name: UI - typecheck, build, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # ui/src/bindings is generated, not committed, so it has to exist before
      # anything typechecks. prism-domain's test suite writes it - which also
      # means a binding cannot silently go stale.
      - name: Generate TypeScript bindings
        working-directory: .
        run: cargo test -p prism-domain

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
