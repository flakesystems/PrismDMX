[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
# **One version for the whole program** — S29. Every crate takes it
# (`version.workspace = true`), `tauri.conf.json` deliberately carries none so
# the bundler falls back to this one, and `crates/prism-app/tests/version.rs`
# is what holds the three together. The release tag is `v` and this.
#
# 0.9.0 is the **first closed beta**: a desk that runs a show end to end and is
# not 1.0 until somebody else's venue has said so. What makes it a beta is the
# release's own pre-release flag rather than a suffix here, because a Windows
# installer version has to be three numbers and nothing else.
version = "0.9.0"
edition = "2024"
# Raised from 1.85 in S17. `std::fs::File::try_lock` was stabilised in 1.89 and
# it is what `prismd` uses for the single-instance guarantee: an advisory lock
# the operating system releases when the process ends is a liveness check that
# needs no platform code, where asking whether a process id is alive does.
# `PROGRESS.md`'s decision log has the reasoning.
rust-version = "1.89"
license = "MIT"
publish = false

# Shared versions so every crate speaks the same serde and the same wire codec.
[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rmp-serde = "1.3"
ts-rs = "12.0"
proptest = "1.11"
proptest-derive = "0.8"

# Shared lint policy. Individual crates opt into stricter rules in their own
# crate root; see crates/prism-engine/src/lib.rs for the real-time constraints.
[workspace.lints.rust]
unsafe_code = "deny"
unused_qualifications = "warn"
# `prism-engine` compiles against loom's instrumented atomics under
# `--cfg loom` (see its crate docs). Declared here rather than per crate
# because a crate that inherits `[lints] workspace = true` cannot add to it.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }

[workspace.lints.clippy]
# CLAUDE.md: no plain println/eprintln in production code - use the structured
# logger. Crates that legitimately write to a terminal opt out explicitly.
print_stdout = "warn"
print_stderr = "warn"
dbg_macro = "warn"
todo = "warn"

[profile.release]
# ARCHITECTURE_SPEC.md 3.1: a panic must be containable at a thread boundary,
# so it must unwind. `abort` would take the DMX output down with it.
panic = "unwind"
lto = "thin"
codegen-units = 1

[profile.bench]
debug = true
