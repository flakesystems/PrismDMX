[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false

# Shared lint policy. Individual crates opt into stricter rules in their own
# crate root; see crates/prism-engine/src/lib.rs for the real-time constraints.
[workspace.lints.rust]
unsafe_code = "deny"
unused_qualifications = "warn"

[workspace.lints.clippy]
# CLAUDE.md: no plain println/eprintln in production code - use the structured
# logger. Crates that legitimately write to a terminal opt out explicitly.
print_stdout = "warn"
print_stderr = "warn"
dbg_macro = "warn"
todo = "warn"

[profile.release]
# ARCHITECTURE_SPEC.md 3.1: a panic must be containable at a thread boundary,
# so it must unwind. `abort` would take the DMX output down with it.
panic = "unwind"
lto = "thin"
codegen-units = 1

[profile.bench]
debug = true
