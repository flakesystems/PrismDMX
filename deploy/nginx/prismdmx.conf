# prismdmx.de und docs.prismdmx.de — zwei Namen, ein nginx.
#
# Es sind zwei `server`-Blöcke und nicht ein Verzeichnis unter dem anderen,
# weil der Eigentümer die Handbücher unter `docs.` haben will und weil beide
# Generatoren nur relative Adressen erzeugen: jede der beiden Ausgaben läuft
# an der Wurzel eines Namens genauso wie in einem Unterverzeichnis. Wer das
# lieber als `prismdmx.de/docs/` hätte, braucht statt eines zweiten Blocks
# einen `location /docs/ { alias /srv/prismdmx/docs/; }` — die Seiten merken
# es nicht.
#
# Kein TLS hier. Das terminiert der Reverse Proxy davor, an einer Stelle für
# alle Dienste dieses Servers.

# Ein unbekannter Host bekommt keine Seite, sondern eine Absage. Ohne diesen
# Block würde der erste `server` die Vorgabe sein und jede fremde Domain, die
# jemand auf diese IP zeigen lässt, käme als prismdmx.de heraus.
server {
    listen 80 default_server;
    server_name _;
    return 404;
}

# --------------------------------------------------------------------------
# Die Startseite
# --------------------------------------------------------------------------
server {
    listen 80;
    server_name prismdmx.de www.prismdmx.de;

    root /srv/prismdmx/www;
    index index.html;

    # Eine einzelne Seite mit drei Beilagen. Was es nicht gibt, gibt es nicht —
    # kein Fallback auf `index.html`, weil hier keine Anwendung mit Routen
    # läuft und ein 200 auf einen Tippfehler eine Lüge wäre.
    location / {
        try_files $uri $uri/ =404;
    }

    include /etc/nginx/conf.d/prismdmx-common.inc;
}

# --------------------------------------------------------------------------
# Die Handbücher
# --------------------------------------------------------------------------
server {
    listen 80;
    server_name docs.prismdmx.de;

    root /srv/prismdmx/docs;
    index index.html;

    # `prism-web` schreibt jede Seite als `<pfad>/index.html`, also findet
    # `try_files` mit dem angehängten Schrägstrich alles, was es gibt.
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    include /etc/nginx/conf.d/prismdmx-common.inc;
}
